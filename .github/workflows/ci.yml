name: Circom circuit and mutation tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  circuit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Circom 2.1.9 (official release)
        run: |
          curl -fL --retry 3 -o /tmp/circom https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          sudo install -m 755 /tmp/circom /usr/local/bin/circom
          circom --version
      - name: Install npm dependencies
        run: npm ci
      - name: Compile and verify baseline and mutated circuits
        run: npm test
